<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AR Pool — WebXR Starter</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 16px; pointer-events: none; font-family: sans-serif; color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8); z-index: 10;
  }
  #hint { font-size: 14px; opacity: 0.85; }
  #start-btn {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    padding: 14px 28px; font-size: 16px; border-radius: 999px; border: none;
    background: #1a73e8; color: white; font-family: sans-serif; z-index: 10;
  }
  #unsupported {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #111; color: white; font-family: sans-serif; text-align: center; padding: 24px; z-index: 20;
  }
</style>
</head>
<body>

<div id="overlay">
  <div id="hint">Point your camera at the floor, tap "Start AR", then tap a flat surface to place the table.</div>
</div>
<button id="start-btn">Start AR</button>
<div id="unsupported">
  <div>
    WebXR AR isn't available in this browser.<br /><br />
    Use <b>Chrome on Android</b> (Safari on iPhone doesn't support handheld WebXR AR yet).
  </div>
</div>

<!-- three.js + WebXR helpers from CDN — no build step, no npm install -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';

let camera, scene, renderer;
let reticle;                 // shows where the table WOULD be placed
let hitTestSource = null;
let hitTestSourceRequested = false;
let tablePlaced = false;
let tableGroup = null;

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  light.position.set(0.5, 1, 0.25);
  scene.add(light);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // --- AR session button ---
  const startBtn = document.getElementById('start-btn');
  if ('xr' in navigator) {
    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
      if (!supported) {
        document.getElementById('unsupported').style.display = 'flex';
        startBtn.style.display = 'none';
      }
    });
  } else {
    document.getElementById('unsupported').style.display = 'flex';
    startBtn.style.display = 'none';
  }

  const arButton = ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.getElementById('overlay') }
  });
  // Reuse our own styled button but trigger the real ARButton logic.
  startBtn.addEventListener('click', () => arButton.click());
  arButton.style.display = 'none';
  document.body.appendChild(arButton);

  // --- Reticle: a ring that snaps to detected surfaces ---
  const ringGeo = new THREE.RingGeometry(0.08, 0.10, 32).rotateX(-Math.PI / 2);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x1a73e8 });
  reticle = new THREE.Mesh(ringGeo, ringMat);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // Tap-to-place
  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  window.addEventListener('resize', onWindowResize);
  renderer.setAnimationLoop(render);
}

function onSelect() {
  if (!reticle.visible || tablePlaced) return;

  tableGroup = buildPlaceholderTable();
  reticle.matrix.decompose(tableGroup.position, tableGroup.quaternion, tableGroup.scale);
  scene.add(tableGroup);
  tablePlaced = true;
  reticle.visible = false;

  document.getElementById('hint').textContent = 'Table placed. (Next step: cue mode + physics.)';
}

// Placeholder geometry so you can SEE something placed — swap for a real table model later.
function buildPlaceholderTable() {
  const group = new THREE.Group();

  const tableGeo = new THREE.BoxGeometry(1.42, 0.08, 2.84); // regulation-ish, meters
  const tableMat = new THREE.MeshStandardMaterial({ color: 0x0b6623 });
  const tableMesh = new THREE.Mesh(tableGeo, tableMat);
  tableMesh.position.y = 0.04;
  group.add(tableMesh);

  const ballGeo = new THREE.SphereGeometry(0.028, 24, 24);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const cueBall = new THREE.Mesh(ballGeo, ballMat);
  cueBall.position.set(0, 0.09, 0.7);
  group.add(cueBall);

  return group;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function render(timestamp, frame) {
  if (frame) {
    const session = renderer.xr.getSession();
    const referenceSpace = renderer.xr.getReferenceSpace();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
        tablePlaced = false;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource && !tablePlaced) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
