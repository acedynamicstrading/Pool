<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AR 8-Ball — WebXR</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 16px; pointer-events: none; font-family: sans-serif; color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8); z-index: 10;
  }
  #hint { font-size: 14px; opacity: 0.85; text-align: center; padding: 0 16px; }
  #warn {
    display: none; margin-top: 8px; font-size: 13px; color: #ffcc66;
    background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 6px;
  }
  #cueModeUI { display: none; flex-direction: column; align-items: center; margin-top: 10px; }
  #power-bar-track {
    width: 160px; height: 10px; background: rgba(255,255,255,0.25);
    border-radius: 6px; overflow: hidden; margin-top: 4px;
  }
  #power-bar-fill { width: 0%; height: 100%; background: #ffdd55; }
  #strike-btn {
    pointer-events: auto; margin-top: 14px; padding: 12px 26px; font-size: 15px;
    border-radius: 999px; border: none; background: #d1352b; color: white;
    font-family: sans-serif; font-weight: 600;
  }
  #strike-btn:disabled { background: #7a2f2f; opacity: 0.8; }
  #start-btn {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    padding: 14px 28px; font-size: 16px; border-radius: 999px; border: none;
    background: #1a73e8; color: white; font-family: sans-serif; z-index: 10;
  }
  #unsupported {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #111; color: white; font-family: sans-serif; text-align: center; padding: 24px; z-index: 20;
  }
</style>
</head>
<body>

<div id="overlay">
  <div id="hint">Point your camera at the floor, tap "Start AR", then tap a flat surface to place the table.</div>
  <div id="warn">You're standing inside the table — step back.</div>
  <div id="cueModeUI">
    <div id="power-bar-track"><div id="power-bar-fill"></div></div>
    <button id="strike-btn">Ready to Strike</button>
  </div>
</div>
<button id="start-btn">Start AR</button>
<div id="unsupported">
  <div>
    WebXR AR isn't available in this browser.<br /><br />
    Use <b>Chrome on Android</b> (Safari on iPhone doesn't support handheld WebXR AR yet).
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';

// ============================================================================
// Globals
// ============================================================================
let camera, scene, renderer;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let tablePlaced = false;
let tableInfo = null;   // { group, playW, playL, feltY, pocketPositions, pocketRadius, cueBallMesh, objectBalls }
let aimLine;

let appState = 'FREE_LOOK';        // FREE_LOOK | CUE_MODE | SHOT
let armedForStrike = false;        // must tap "Ready to Strike" before a swing counts

const ENTER_CUE_ANGLE = 55;
const EXIT_CUE_ANGLE = 40;
const MAX_TABLE_DIST = 3.5;

const BACKSWING_THRESHOLD = -0.15;
const STROKE_THRESHOLD = 0.35;
const DECEL_THRESHOLD = 0.12;
const ARM_WINDOW_SECONDS = 1.2;
const MAX_EXPECTED_SPEED = 1.2;
const MAX_BALL_SPEED = 3.2;

const BALL_RADIUS = 0.028;
const FRICTION_DECEL = 1.1;
const CUSHION_RESTITUTION = 0.72;
const COLLISION_RESTITUTION = 0.95;

let strokeArmState = 'IDLE';
let strokeArmTimer = 0;
let peakForwardSpeed = 0;
let prevCamPos = new THREE.Vector3();
let camVelocity = new THREE.Vector3();
let prevCamPosInit = false;
let lastTimestamp = 0;

let balls = [];        // ALL physics balls (cue + 15 object balls): { mesh, pos, vel, active, isCue, number }
let cueBallRef = null;

let insideTableWarning = false;

let hintEl, warnEl, cueModeUIEl, powerFillEl, strikeBtn;

init();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  light.position.set(0.5, 1, 0.25);
  scene.add(light);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  hintEl = document.getElementById('hint');
  warnEl = document.getElementById('warn');
  cueModeUIEl = document.getElementById('cueModeUI');
  powerFillEl = document.getElementById('power-bar-fill');
  strikeBtn = document.getElementById('strike-btn');

  strikeBtn.addEventListener('click', () => {
    armedForStrike = true;
    strokeArmState = 'IDLE';
    peakForwardSpeed = 0;
    strikeBtn.textContent = 'Armed — pull back, then swing';
    strikeBtn.disabled = true;
  });

  const startBtn = document.getElementById('start-btn');
  if ('xr' in navigator) {
    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
      if (!supported) {
        document.getElementById('unsupported').style.display = 'flex';
        startBtn.style.display = 'none';
      }
    });
  } else {
    document.getElementById('unsupported').style.display = 'flex';
    startBtn.style.display = 'none';
  }

  const arButton = ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.getElementById('overlay') }
  });
  startBtn.addEventListener('click', () => arButton.click());
  arButton.style.display = 'none';
  document.body.appendChild(arButton);

  const ringGeo = new THREE.RingGeometry(0.08, 0.10, 32).rotateX(-Math.PI / 2);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x1a73e8 });
  reticle = new THREE.Mesh(ringGeo, ringMat);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  const aimGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const aimMat = new THREE.LineBasicMaterial({ color: 0xffdd55 });
  aimLine = new THREE.Line(aimGeo, aimMat);
  aimLine.visible = false;
  scene.add(aimLine);

  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  window.addEventListener('resize', onWindowResize);
  renderer.setAnimationLoop(render);
}

function onSelect() {
  if (!reticle.visible || tablePlaced) return;

  tableInfo = buildPoolTable();
  reticle.matrix.decompose(tableInfo.group.position, tableInfo.group.quaternion, tableInfo.group.scale);
  scene.add(tableInfo.group);

  cueBallRef = {
    mesh: tableInfo.cueBallMesh,
    pos: new THREE.Vector3(tableInfo.cueBallMesh.position.x, 0, tableInfo.cueBallMesh.position.z),
    vel: new THREE.Vector3(),
    active: true,
    isCue: true
  };
  balls = [cueBallRef];
  for (const ob of tableInfo.objectBalls) {
    balls.push({
      mesh: ob.mesh,
      pos: new THREE.Vector3(ob.mesh.position.x, 0, ob.mesh.position.z),
      vel: new THREE.Vector3(),
      active: true,
      isCue: false,
      number: ob.number
    });
  }

  tablePlaced = true;
  reticle.visible = false;
  hintEl.textContent = 'Tilt the phone down toward the table to aim.';
}

// ============================================================================
// Materials
// ============================================================================
const MAT_FELT    = new THREE.MeshStandardMaterial({ color: 0x0b6623, roughness: 0.95 });
const MAT_WOOD     = new THREE.MeshStandardMaterial({ color: 0x3b2417, roughness: 0.6 });
const MAT_CUSHION  = new THREE.MeshStandardMaterial({ color: 0x0a5a1f, roughness: 0.8 });
const MAT_POCKET   = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
const MAT_LINE     = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
const MAT_CUEBALL  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });

function hexToCss(hex) { return '#' + hex.toString(16).padStart(6, '0'); }

function makeSolidMaterial(hex) {
  return new THREE.MeshStandardMaterial({ color: hex, roughness: 0.35 });
}

// Stripe balls: white base with a colored equatorial band, built as a small canvas
// texture (no external image assets needed).
function makeStripeMaterial(hex) {
  const w = 128, h = 64;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = hexToCss(hex);
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff';
  const bandH = h * 0.62;
  ctx.fillRect(0, (h - bandH) / 2, w, bandH);
  const tex = new THREE.CanvasTexture(canvas);
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.35 });
}

const BALL_DATA = [
  { num: 1, type: 'solid',  color: 0xf2c400 },
  { num: 2, type: 'solid',  color: 0x1e5fbf },
  { num: 3, type: 'solid',  color: 0xd1352b },
  { num: 4, type: 'solid',  color: 0x6a2c91 },
  { num: 5, type: 'solid',  color: 0xe07a17 },
  { num: 6, type: 'solid',  color: 0x1c7a3a },
  { num: 7, type: 'solid',  color: 0x7a2f2f },
  { num: 8, type: 'eight',  color: 0x111111 },
  { num: 9, type: 'stripe', color: 0xf2c400 },
  { num: 10, type: 'stripe', color: 0x1e5fbf },
  { num: 11, type: 'stripe', color: 0xd1352b },
  { num: 12, type: 'stripe', color: 0x6a2c91 },
  { num: 13, type: 'stripe', color: 0xe07a17 },
  { num: 14, type: 'stripe', color: 0x1c7a3a },
  { num: 15, type: 'stripe', color: 0x7a2f2f }
];

// ============================================================================
// Table construction
// ============================================================================
function buildPoolTable() {
  const group = new THREE.Group();

  const tableW = 1.42, tableL = 2.84;
  const railWidth = 0.12;
  const railHeight = 0.06;
  const baseThickness = 0.04;
  const playW = tableW - railWidth * 2;
  const playL = tableL - railWidth * 2;
  const pocketRadius = 0.055;
  const cushionHeight = 0.025;
  const cushionDepth = 0.035;
  const cornerGap = pocketRadius * 2.3;
  const sideGap = pocketRadius * 2.3;

  const feltY = baseThickness;
  const cushionY = feltY + cushionHeight / 2;
  const railY = baseThickness + railHeight / 2;

  const base = new THREE.Mesh(new THREE.BoxGeometry(tableW, baseThickness, tableL), MAT_WOOD);
  base.position.y = baseThickness / 2;
  group.add(base);

  const felt = new THREE.Mesh(new THREE.BoxGeometry(playW, 0.004, playL), MAT_FELT);
  felt.position.y = feltY;
  group.add(felt);

  const topRail = new THREE.Mesh(new THREE.BoxGeometry(tableW, railHeight, railWidth), MAT_WOOD);
  topRail.position.set(0, railY, playL / 2 + railWidth / 2);
  group.add(topRail);
  const botRail = topRail.clone();
  botRail.position.z = -(playL / 2 + railWidth / 2);
  group.add(botRail);

  const sideRailGeo = new THREE.BoxGeometry(railWidth, railHeight, playL);
  const leftRail = new THREE.Mesh(sideRailGeo, MAT_WOOD);
  leftRail.position.set(-(playW / 2 + railWidth / 2), railY, 0);
  group.add(leftRail);
  const rightRail = leftRail.clone();
  rightRail.position.x = playW / 2 + railWidth / 2;
  group.add(rightRail);

  const pocketGeo = new THREE.CylinderGeometry(pocketRadius, pocketRadius, 0.01, 24);
  const pocketPositions = [
    [-playW / 2, playL / 2], [playW / 2, playL / 2],
    [-playW / 2, -playL / 2], [playW / 2, -playL / 2],
    [-playW / 2, 0], [playW / 2, 0]
  ];
  for (const [px, pz] of pocketPositions) {
    const pocket = new THREE.Mesh(pocketGeo, MAT_POCKET);
    pocket.position.set(px, feltY + 0.001, pz);
    group.add(pocket);
  }

  const shortSegLen = playW - 2 * cornerGap;
  const shortCushionGeo = new THREE.BoxGeometry(shortSegLen, cushionHeight, cushionDepth);
  const topCushion = new THREE.Mesh(shortCushionGeo, MAT_CUSHION);
  topCushion.position.set(0, cushionY, playL / 2 - cushionDepth / 2);
  group.add(topCushion);
  const botCushion = new THREE.Mesh(shortCushionGeo, MAT_CUSHION);
  botCushion.position.set(0, cushionY, -(playL / 2 - cushionDepth / 2));
  group.add(botCushion);

  const longSegLen = (playL - 2 * cornerGap - sideGap) / 2;
  const longCushionGeo = new THREE.BoxGeometry(cushionDepth, cushionHeight, longSegLen);
  const longSegCenterOffset = sideGap / 2 + longSegLen / 2;
  for (const xSide of [-1, 1]) {
    for (const zSide of [-1, 1]) {
      const cushion = new THREE.Mesh(longCushionGeo, MAT_CUSHION);
      cushion.position.set(xSide * (playW / 2 - cushionDepth / 2), cushionY, zSide * longSegCenterOffset);
      group.add(cushion);
    }
  }

  // --- Angled cushion "noses" bridging each cushion end into its neighboring pocket mouth ---
  // Real tables taper the cushion toward the pocket rather than a blunt perpendicular cut;
  // this closes the visual gap/overlap you saw at the corners and side pockets.
  function addPocketNoses(pocketX, pocketZ, endpoints) {
    for (const ep of endpoints) {
      const dx = pocketX - ep.x, dz = pocketZ - ep.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.001) continue;
      const dirX = dx / dist, dirZ = dz / dist;
      const noseLen = Math.max(dist - pocketRadius * 0.85, 0.01);
      const midX = ep.x + dirX * noseLen / 2;
      const midZ = ep.z + dirZ * noseLen / 2;
      const angle = Math.atan2(dirZ, dirX);
      const nose = new THREE.Mesh(
        new THREE.BoxGeometry(noseLen, cushionHeight, cushionDepth * 0.8),
        MAT_CUSHION
      );
      nose.position.set(midX, cushionY, midZ);
      nose.rotation.y = -angle;
      group.add(nose);
    }
  }

  for (const xSide of [-1, 1]) {
    for (const zSide of [-1, 1]) {
      const pocketX = xSide * playW / 2, pocketZ = zSide * playL / 2;
      const shortEnd = { x: xSide * shortSegLen / 2, z: zSide * (playL / 2 - cushionDepth / 2) };
      const longEnd = { x: xSide * (playW / 2 - cushionDepth / 2), z: zSide * (longSegCenterOffset + longSegLen / 2) };
      addPocketNoses(pocketX, pocketZ, [shortEnd, longEnd]);
    }
  }
  for (const xSide of [-1, 1]) {
    const pocketX = xSide * playW / 2, pocketZ = 0;
    const end1 = { x: xSide * (playW / 2 - cushionDepth / 2), z: longSegCenterOffset - longSegLen / 2 };
    const end2 = { x: xSide * (playW / 2 - cushionDepth / 2), z: -(longSegCenterOffset - longSegLen / 2) };
    addPocketNoses(pocketX, pocketZ, [end1, end2]);
  }

  const headString = new THREE.Mesh(new THREE.PlaneGeometry(playW, 0.004).rotateX(-Math.PI / 2), MAT_LINE);
  headString.position.set(0, feltY + 0.003, playL / 4);
  group.add(headString);

  const footSpot = new THREE.Mesh(new THREE.CircleGeometry(0.006, 16).rotateX(-Math.PI / 2), MAT_LINE);
  footSpot.position.set(0, feltY + 0.003, -playL / 4);
  group.add(footSpot);

  const cueBallMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 24, 24), MAT_CUEBALL);
  cueBallMesh.position.set(0, feltY + BALL_RADIUS, playL / 4);
  group.add(cueBallMesh);

  // --- Object ball rack: standard 15-ball triangle, apex at the foot spot,
  //     8-ball fixed at the true center, everything else shuffled around it. ---
  const d = BALL_RADIUS * 2;
  const rowSpacing = d * Math.sqrt(3) / 2;
  const apexZ = -playL / 4;
  const rackSlots = [];
  for (let row = 0; row < 5; row++) {
    for (let k = 0; k <= row; k++) {
      rackSlots.push({ x: (k - row / 2) * d, z: apexZ - row * rowSpacing });
    }
  }
  const CENTER_SLOT_INDEX = 4; // middle ball of the 3rd row — traditional 8-ball position

  const remaining = BALL_DATA.filter((b) => b.type !== 'eight');
  for (let i = remaining.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
  }

  const objectBalls = [];
  let ri = 0;
  for (let i = 0; i < rackSlots.length; i++) {
    const data = (i === CENTER_SLOT_INDEX) ? BALL_DATA.find((b) => b.type === 'eight') : remaining[ri++];
    const mat = data.type === 'stripe' ? makeStripeMaterial(data.color) : makeSolidMaterial(data.color);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 24, 24), mat);
    mesh.position.set(rackSlots[i].x, feltY + BALL_RADIUS, rackSlots[i].z);
    group.add(mesh);
    objectBalls.push({ mesh, number: data.num, type: data.type });
  }

  return { group, playW, playL, feltY, pocketPositions, pocketRadius, cueBallMesh, objectBalls };
}

// ============================================================================
// Cue Mode state machine
// ============================================================================
function getDownwardPitchAngle(cam) {
  const forward = new THREE.Vector3();
  cam.getWorldDirection(forward);
  const angleFromStraightDown = forward.angleTo(new THREE.Vector3(0, -1, 0)) * (180 / Math.PI);
  return 90 - angleFromStraightDown;
}

function updateCueModeStateMachine() {
  if (appState === 'SHOT' || !tableInfo) return;

  const pitch = getDownwardPitchAngle(camera);
  const dist = camera.position.distanceTo(tableInfo.group.position);
  const nearTable = dist <= MAX_TABLE_DIST;

  if (appState === 'FREE_LOOK') {
    if (pitch >= ENTER_CUE_ANGLE && nearTable) enterCueMode();
  } else if (appState === 'CUE_MODE') {
    if (pitch < EXIT_CUE_ANGLE || !nearTable) exitCueMode();
  }
}

function enterCueMode() {
  appState = 'CUE_MODE';
  cueModeUIEl.style.display = 'flex';
  aimLine.visible = true;
  strokeArmState = 'IDLE';
  peakForwardSpeed = 0;
  armedForStrike = false;
  strikeBtn.disabled = false;
  strikeBtn.textContent = 'Ready to Strike';
  hintEl.textContent = 'Cue Mode — aim, then tap "Ready to Strike" before you swing.';
}

function exitCueMode() {
  appState = 'FREE_LOOK';
  cueModeUIEl.style.display = 'none';
  aimLine.visible = false;
  strokeArmState = 'IDLE';
  armedForStrike = false;
  hintEl.textContent = 'Tilt the phone down toward the table to aim.';
}

// ============================================================================
// Stroke detector — gated by the "Ready to Strike" button so a shot only
// counts once the player has explicitly signaled intent, not on any swing
// that happens to occur while just looking around in Cue Mode.
// ============================================================================
function updateStrokeDetector(dt) {
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() < 0.0001) return;
  forward.normalize();

  updateAimLine(forward);

  if (!armedForStrike) return;

  const forwardSpeed = camVelocity.dot(forward);

  switch (strokeArmState) {
    case 'IDLE':
      if (forwardSpeed <= BACKSWING_THRESHOLD) {
        strokeArmState = 'BACKSWING';
        strokeArmTimer = 0;
      }
      break;
    case 'BACKSWING':
      strokeArmTimer += dt;
      if (strokeArmTimer > ARM_WINDOW_SECONDS) {
        strokeArmState = 'IDLE';
        break;
      }
      if (forwardSpeed >= STROKE_THRESHOLD) {
        strokeArmState = 'STROKE';
        peakForwardSpeed = forwardSpeed;
      }
      break;
    case 'STROKE':
      peakForwardSpeed = Math.max(peakForwardSpeed, forwardSpeed);
      if (forwardSpeed <= DECEL_THRESHOLD) {
        commitStroke(forward, peakForwardSpeed);
        strokeArmState = 'IDLE';
      }
      break;
  }

  powerFillEl.style.width = `${Math.max(0, Math.min(1, peakForwardSpeed / MAX_EXPECTED_SPEED)) * 100}%`;
}

function commitStroke(worldDirection, peakSpeed) {
  if (!cueBallRef || !cueBallRef.active || !tableInfo) return;

  const invQuat = tableInfo.group.quaternion.clone().invert();
  const localDir = worldDirection.clone().applyQuaternion(invQuat);
  localDir.y = 0;
  if (localDir.lengthSq() < 0.0001) return;
  localDir.normalize();

  const power = Math.min(1, peakSpeed / MAX_EXPECTED_SPEED);
  const speed = power * MAX_BALL_SPEED;
  cueBallRef.vel.set(localDir.x * speed, 0, localDir.z * speed);

  peakForwardSpeed = 0;
  armedForStrike = false;
  appState = 'SHOT';
  cueModeUIEl.style.display = 'none';
  aimLine.visible = false;
  hintEl.textContent = '';
}

function updateAimLine(worldForward) {
  if (!cueBallRef || !cueBallRef.active) return;
  const ballWorldPos = new THREE.Vector3();
  cueBallRef.mesh.getWorldPosition(ballWorldPos);

  const lineLen = 0.22 + Math.min(1, peakForwardSpeed / MAX_EXPECTED_SPEED) * 0.12;
  const start = ballWorldPos.clone().addScaledVector(worldForward, -lineLen);

  const posAttr = aimLine.geometry.attributes.position;
  posAttr.setXYZ(0, start.x, start.y, start.z);
  posAttr.setXYZ(1, ballWorldPos.x, ballWorldPos.y, ballWorldPos.z);
  posAttr.needsUpdate = true;
}

// ============================================================================
// Ball physics: friction + cushion bounce + pocket capture + ball-to-ball
// collision, all in the table's local X/Z plane.
// ============================================================================
function resolveBallCollision(a, b) {
  const dx = a.pos.x - b.pos.x, dz = a.pos.z - b.pos.z;
  const distSq = dx * dx + dz * dz;
  const minDist = BALL_RADIUS * 2;
  if (distSq >= minDist * minDist || distSq < 1e-9) return;

  const dist = Math.sqrt(distSq);
  const nx = dx / dist, nz = dz / dist;
  const overlap = minDist - dist;
  a.pos.x += nx * overlap * 0.5; a.pos.z += nz * overlap * 0.5;
  b.pos.x -= nx * overlap * 0.5; b.pos.z -= nz * overlap * 0.5;

  const relVel = (a.vel.x - b.vel.x) * nx + (a.vel.z - b.vel.z) * nz;
  if (relVel < 0) {
    const impulse = -relVel * COLLISION_RESTITUTION;
    a.vel.x += nx * impulse; a.vel.z += nz * impulse;
    b.vel.x -= nx * impulse; b.vel.z -= nz * impulse;
  }

  a.mesh.position.set(a.pos.x, a.mesh.position.y, a.pos.z);
  b.mesh.position.set(b.pos.x, b.mesh.position.y, b.pos.z);
}

function updateBallPhysics(dt) {
  if (!tableInfo || dt <= 0) return;
  const { playW, playL, feltY, pocketPositions, pocketRadius } = tableInfo;
  let anyMoving = false;

  for (const ball of balls) {
    if (!ball.active) continue;
    const speed = ball.vel.length();
    if (speed <= 0.0001) continue;

    anyMoving = true;
    const newSpeed = Math.max(0, speed - FRICTION_DECEL * dt);
    ball.vel.multiplyScalar(newSpeed / speed);
    ball.pos.addScaledVector(ball.vel, dt);

    let captured = false;
    for (const [px, pz] of pocketPositions) {
      const dx = ball.pos.x - px, dz = ball.pos.z - pz;
      if (dx * dx + dz * dz < pocketRadius * pocketRadius) {
        ball.active = false;
        ball.mesh.visible = false;
        captured = true;
        break;
      }
    }
    if (captured) continue;

    const halfW = playW / 2 - BALL_RADIUS;
    const halfL = playL / 2 - BALL_RADIUS;
    if (ball.pos.x > halfW)  { ball.pos.x = halfW;  ball.vel.x *= -CUSHION_RESTITUTION; }
    if (ball.pos.x < -halfW) { ball.pos.x = -halfW; ball.vel.x *= -CUSHION_RESTITUTION; }
    if (ball.pos.z > halfL)  { ball.pos.z = halfL;  ball.vel.z *= -CUSHION_RESTITUTION; }
    if (ball.pos.z < -halfL) { ball.pos.z = -halfL; ball.vel.z *= -CUSHION_RESTITUTION; }

    ball.mesh.position.set(ball.pos.x, feltY + BALL_RADIUS, ball.pos.z);
  }

  for (let i = 0; i < balls.length; i++) {
    if (!balls[i].active) continue;
    for (let j = i + 1; j < balls.length; j++) {
      if (!balls[j].active) continue;
      resolveBallCollision(balls[i], balls[j]);
    }
  }

  if (appState === 'SHOT' && !anyMoving) {
    if (cueBallRef && !cueBallRef.active) {
      // Scratch: only the CUE ball ever comes back — that's the "ball in hand" rule.
      // Object balls that go in STAY in; that's how points are scored in real 8-ball.
      cueBallRef.active = true;
      cueBallRef.mesh.visible = true;
      cueBallRef.pos.set(0, 0, tableInfo.playL / 4);
      cueBallRef.vel.set(0, 0, 0);
      cueBallRef.mesh.position.set(0, tableInfo.feltY + BALL_RADIUS, tableInfo.playL / 4);
      hintEl.textContent = 'Scratch — cue ball respawned (ball in hand). Tilt down to aim.';
    } else {
      hintEl.textContent = 'Tilt the phone down toward the table to aim.';
    }
    appState = 'FREE_LOOK';
  }
}

// ============================================================================
// AR camera walking "through" the table — a fundamental limitation, not a bug:
// a virtual object has no physical presence, so nothing can stop the player's
// real body from occupying the same space. Best we can do is hide the table
// and warn rather than render a broken clipped mess while they're inside it.
// ============================================================================
function updateTableOcclusionGuard() {
  if (!tableInfo) return;
  const localCam = tableInfo.group.worldToLocal(camera.position.clone());
  const margin = 0.15;
  const inside = Math.abs(localCam.x) < tableInfo.playW / 2 + 0.12 + margin &&
                 Math.abs(localCam.z) < tableInfo.playL / 2 + 0.12 + margin &&
                 localCam.y < 0.9 && localCam.y > -0.3;

  if (inside && !insideTableWarning) {
    insideTableWarning = true;
    tableInfo.group.visible = false;
    warnEl.style.display = 'block';
  } else if (!inside && insideTableWarning) {
    insideTableWarning = false;
    tableInfo.group.visible = true;
    warnEl.style.display = 'none';
  }
}

// ============================================================================
// Main loop
// ============================================================================
function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function render(timestamp, frame) {
  if (frame) {
    const session = renderer.xr.getSession();
    const referenceSpace = renderer.xr.getReferenceSpace();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
        tablePlaced = false;
        tableInfo = null;
        balls = [];
        cueBallRef = null;
        prevCamPosInit = false;
        insideTableWarning = false;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource && !tablePlaced) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const pose = hitTestResults[0].getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, 0.05) : 0;
    lastTimestamp = timestamp;

    if (tablePlaced) {
      if (!prevCamPosInit) {
        prevCamPos.copy(camera.position);
        prevCamPosInit = true;
      } else if (dt > 0) {
        const instVel = new THREE.Vector3().subVectors(camera.position, prevCamPos).divideScalar(dt);
        camVelocity.lerp(instVel, 0.35);
        prevCamPos.copy(camera.position);
      }

      updateTableOcclusionGuard();
      updateCueModeStateMachine();
      if (appState === 'CUE_MODE') updateStrokeDetector(dt);
      updateBallPhysics(dt);
    }
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
